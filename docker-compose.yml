version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: project-mesh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-meshuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-projectmesh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-meshuser} -d ${DB_NAME:-projectmesh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-mesh-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-meshuser}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-projectmesh}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Project Mesh}
      NODE_ENV: production
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-mesh-migrate
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-meshuser}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-projectmesh}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  uploads_data:
