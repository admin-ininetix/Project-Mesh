version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: projectmesh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meshuser
      POSTGRES_PASSWORD: meshpassword
      POSTGRES_DB: projectmesh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshuser -d projectmesh"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectmesh-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meshuser:meshpassword@db:5432/projectmesh
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production-min-32-chars}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./prisma:/app/prisma

volumes:
  postgres_data:
